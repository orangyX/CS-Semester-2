{% extends "pico_base_template.html" %}
{% block content %}
    <h2>Members of {{ cls }}</h2>
    <table class="striped">
    <thead>
        <tr><th>Entity</th><th>Title</th></tr>
    </thead>
    <tbody>
        {% for m in members %}
        <tr>
            <td><a href="/search?q={{ m.name }}" class="contrast">{{ m.name }}</a></td>
            <td>{{ m.title }}</td>
        </tr>
        {% else %}
        <tr><td colspan="2">None</td></tr>
        {% endfor %}
    </tbody>
    </table>
{% endblock %}
