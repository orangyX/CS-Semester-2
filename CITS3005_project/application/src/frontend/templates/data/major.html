{% extends "pico_base_template.html" %}
{% block content %}
    <h2>Majors</h2>
    <table class="striped">
        <thead>
            <tr>
                <th>Code</th>
                <th>Title</th>
                <th>School</th>
            </tr>
        </thead>
        <tbody>
            {% for major in majors %}
            <tr>
                <td><a href="/browse/major/{{ major.code }}" class="contrast">{{ major.code }}</a></td>
                <td>{{ major.title }}</td>
                <td>{{ major.school|replace("School_", "")|replace("_", " ") }}</td>
            </tr>
            {% else %}
            <tr><td colspan="3">None</td></tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
