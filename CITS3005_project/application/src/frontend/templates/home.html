    {% extends "pico_base_template.html" %}
    {% block content %}
        <h2>Browse by</h2>
        <div role="group">
            <!-- Degree, Major, and Unit buttons -->
            <a role="button" href="/degrees">Degree</a>
            <a role="button" href="/majors">Major</a>
            <a role="button" href="/units">Unit</a>
        </div>
        <h2>Search</h2>
        <!-- A search bar -->
        <form action="/search">
            <fieldset role="group">
                <input type="search" name="q" placeholder="e.g. data analysis">
                <input type="submit" value="Search">
            </fieldset>
        </form>
    {% endblock %}
