{% extends "pico_base_template.html" %}
{% block content %}
    <h2>Units</h2>
    <table class="striped">
        <thead>
            <tr>
                <th>Code</th>
                <th>Title</th>
                <th>Level</th>
                <th>Credits</th>
            </tr>
        </thead>
        <tbody>
             <!-- A for loop; loop over all units and fetch the required information -->
             {% for unit in units %}
             <tr>
                <td>{{ unit.code}}</td>
                <td>{{ unit.title }}</td>
                <td>{{ unit.level }}</td>
                <td>{{ unit.credits }}</td>
             </tr>
             {% endfor %}
        </tbody>
    </table>
{% endblock %}
