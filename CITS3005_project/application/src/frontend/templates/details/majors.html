{% extends "pico_base_template.html" %}
{% block content %}
    <h2>Majors</h2>
    <table class="striped">
        <thead>
            <tr>
                <th>Code</th>
                <th>Title</th>
                <th>School</th>
            </tr>
        </thead>
        <tbody>
            <!-- This section will store the data; it is empty at the moment -->
             <!-- A for loop; loop over all Majors and fetch the required information -->
             {% for major in majors %}
             <tr>
                <td><a href="/browse/major/{{ major.code }}" class="contrast">{{ major.code }}</a></td>
                <td>{{ major.title }}</td>
                <td>{{ major.school }}</td>
             </tr>
             {% endfor %}
        </tbody>
    </table>
{% endblock %}
