{% extends "pico_base_template.html" %}
{% block content %}
    <h2>Degrees</h2>
    <table class="striped">
        <thead>
            <tr>
                <th>Code</th>
                <th>Title</th>
                <th>Study type</th>
            </tr>
        </thead>
        <tbody>
            {% for degree in degrees %}
            <tr>
                <td><a href="/browse/degree/{{ degree.code }}" class="contrast">{{ degree.code }}</a></td>
                <td>{{ degree.title }}</td>
                <td>{{ degree.study_type|replace("StudyType_", "") }}</td>
            </tr>
            {% else %}
            <tr><td colspan="3">None</td></tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
